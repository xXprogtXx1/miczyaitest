<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="referrer" content="no-referrer" />
  <meta name="color-scheme" content="light dark" />
  <title>MiczyAI · Chat condivisa</title>
  <link rel="icon" type="image/png" href="../miczy-favicon.png" />
  <style>
    :root { --bg:#d9ccff; --win:#fff; --bar:#ffd93d; --ink:#17141f; --muted:#5b5675; --edge:#17141f; --hard:#17141f;
            --pink:#ff5ca8; --user-bg:#ffd93d; --user-ink:#17141f; --ai-bg:#f4f0ff; --code:#ece6ff; }
    body.dark-mode { --bg:#140a33; --win:#1b1040; --bar:#3a1f8a; --ink:#f1ecff; --muted:#b9abe8; --edge:#6ef3ff; --hard:#ff3cac;
                     --user-bg:#3a1f8a; --user-ink:#f1ecff; --ai-bg:#241556; --code:#140a33; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; padding:1rem; font-family:"Instrument Sans", system-ui, "Segoe UI", sans-serif;
           background:var(--bg); color:var(--ink); }
    .win { width:min(42rem,100%); margin:1rem auto; border:3px solid var(--edge); border-radius:1.2rem; background:var(--win);
           box-shadow:7px 7px 0 var(--hard); overflow:hidden; }
    .bar { display:flex; justify-content:space-between; gap:.6rem; padding:.6rem 1rem; background:var(--bar);
           border-bottom:3px solid var(--edge); font-weight:700; font-size:.85rem; color:#17141f; }
    body.dark-mode .bar { color:var(--ink); }
    .corpo { padding:1.2rem 1.1rem 1.5rem; }
    h1 { margin:0 0 .2rem; font-size:1.4rem; letter-spacing:-.02em; overflow-wrap:anywhere; }
    .sotto { margin:0 0 1.2rem; color:var(--muted); font-size:.85rem; }
    .chat { display:flex; flex-direction:column; gap:.9rem; }
    .msg { max-width:88%; padding:.65rem .95rem; border:3px solid var(--edge); overflow-wrap:anywhere; box-shadow:3px 3px 0 var(--hard);
           line-height:1.5; }
    .msg.utente { align-self:flex-end; border-radius:1rem 1rem .25rem 1rem; background:var(--user-bg); color:var(--user-ink);
                  font-weight:500; white-space:pre-wrap; }
    .msg.ai { align-self:flex-start; border-radius:1rem 1rem 1rem .25rem; background:var(--ai-bg); }
    .msg.ai > :first-child { margin-top:0; } .msg.ai > :last-child { margin-bottom:0; }
    .msg.ai pre { overflow-x:auto; padding:.6rem .8rem; border-radius:.6rem; background:var(--code); }
    .msg.ai code { font-family:ui-monospace, Menlo, Consolas, monospace; font-size:.9em; }
    .msg.ai :not(pre) > code { padding:.1rem .3rem; border-radius:.3rem; background:var(--code); }
    .msg.ai table { border-collapse:collapse; display:block; overflow-x:auto; }
    .msg.ai th, .msg.ai td { border:2px solid var(--edge); padding:.25rem .5rem; }
    .msg.ai a { color:inherit; }
    .stato { padding:2.2rem 1rem; text-align:center; color:var(--muted); line-height:1.5; }
    .stato .icona { font-size:2.6rem; line-height:1; margin-bottom:.4rem; }
    .stato p { margin:0 0 1rem; }
    .nota { margin:1.2rem 0 0; font-size:.8rem; color:var(--muted); text-align:center; }
    a.btn { display:inline-block; padding:.65rem 1.4rem; border:3px solid var(--edge); border-radius:999px; background:var(--pink);
            color:#17141f; font-weight:700; text-decoration:none; box-shadow:3px 3px 0 var(--hard); }
    a.btn:hover { background:var(--bar); }
    a.btn:active { transform:translate(3px,3px); box-shadow:none; }
    a.btn:focus-visible { outline:3px solid var(--ink); outline-offset:3px; }
    .azioni { margin-top:1.4rem; text-align:center; }
  </style>
</head>
<body>
  <main class="win">
    <div class="bar"><span>MiczyAI · chat condivisa</span><span>sola lettura</span></div>
    <div class="corpo" id="corpo" aria-live="polite">
      <div class="stato"><div class="icona">⏳</div><p>Carico la chat…</p></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"
          integrity="sha384-QsSpx6a0USazT7nK7w8qXDgpSAPhFsb2XtpoLFQ5+X2yFN6hvCKnwEzN8M5FWaJb"
          crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.14/dist/purify.min.js"
          integrity="sha384-46dPGH1XlTmj7bc50bqLjTdORXs/3EP2QpA/6EWbelYWOY9VGp+87RT61S3Mcslb"
          crossorigin="anonymous"></script>
  <script src="../config.js"></script>
  <script src="condivisa.js"></script>
</body>
</html>
